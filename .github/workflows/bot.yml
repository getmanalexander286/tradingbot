name: Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  durchlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Bot ausfuehren
        run: python trader.py

      - name: Dashboard erzeugen
        run: python build_dashboard.py

      - name: Stand zurueckschreiben
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state docs
          if git diff --staged --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Durchlauf $(date -u '+%Y-%m-%d %H:%M UTC')"
            for versuch in 1 2 3; do
              if git push; then exit 0; fi
              git pull --rebase --autostash || true
              sleep 5
            done
            echo "Push fehlgeschlagen." && exit 1
          fi
